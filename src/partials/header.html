<a class="skip" href="#contenido">Saltar al contenido</a>
<header class="site-header">
  <div class="wrap header-in">
    <a class="brand" href="/"><img src="/assets/img/logo-tabano.png" width="154" height="63" alt="Tabano, ir al inicio"></a>
    <button class="nav-btn" type="button" aria-expanded="false" aria-controls="menu">
      <span class="sr-only">Menú</span>
      <svg class="ico ico-open" aria-hidden="true"><use href="#i-menu"/></svg>
      <svg class="ico ico-close" aria-hidden="true"><use href="#i-close"/></svg>
    </button>
    <nav class="nav" id="menu" aria-label="Principal">
      {{#each site.nav as n}}<a href="{{ n.url }}"{{#if n.actual}} aria-current="page"{{/if}}>{{ n.name }}</a>{{/each}}
      <a class="btn btn-primary btn-sm" href="/contacto/" data-track="contact" data-location="header">Solicitar diagnóstico</a>
    </nav>
  </div>
</header>
