<!DOCTYPE html>
<html lang="es-CL" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ seo.title }}</title>
  <meta name="description" content="{{ seo.description }}">
  <link rel="canonical" href="{{ seo.canonical }}">
  <meta name="robots" content="{{ seo.robots }}">
  <meta name="theme-color" content="#F6F3EC">
  {{#if site.googleVerification}}<meta name="google-site-verification" content="{{ site.googleVerification }}">{{/if}}
  <meta property="og:type" content="{{ seo.ogType }}">
  <meta property="og:site_name" content="Tabano">
  <meta property="og:locale" content="es_CL">
  <meta property="og:title" content="{{ seo.title }}">
  <meta property="og:description" content="{{ seo.description }}">
  <meta property="og:url" content="{{ seo.canonical }}">
  <meta property="og:image" content="{{ seo.ogImage }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Tabano, marketing digital y desarrollo web">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/assets/img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="stylesheet" href="/assets/css/main.css?v={{ site.assetV }}">
  <script>document.documentElement.className = 'js';</script>
  {{{ jsonld }}}
</head>
<body data-gtm="{{ site.gtmId }}">
{{> sprite}}
{{> header}}
<main id="contenido">
{{{ content }}}
</main>
{{> footer}}
<script src="/assets/js/main.js?v={{ site.assetV }}" defer></script>
</body>
</html>
